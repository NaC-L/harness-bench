<line x1="606.68" y1="312.23" x2="630.68" y2="312.23" stroke="#0072B2" stroke-width="3" class="median-tick"/>
<circle cx="705.32" cy="244.23" r="4.5" fill="#E69F00" stroke="#E69F00" stroke-width="2" class="run-marker" data-passed="true"/>
<line x1="693.32" y1="244.23" x2="717.32" y2="244.23" stroke="#E69F00" stroke-width="3" class="median-tick"/>
<text x="662.00" y="494.00" font-size="12" text-anchor="middle" fill="#222222">feature-lru</text>
<text x="24.00" y="528.00" font-size="12" text-anchor="start" fill="#222222">0 runs omitted: unknown seconds. Medians use known runs, including failures.</text>
</g>
</svg>
